version: '3.8'

services:
  db:
    build: ./docker_project/db
    container_name: sqlite_db
    volumes:
      - db_data:/data
    restart: always
    networks:
      - app_network

  app:
    build: ./docker_project/app
    container_name: flask_app
    ports:
      - "5000:5000"
    volumes:
      - db_data:/data
    depends_on:
      - db
    restart: always
    networks:
      - app_network

volumes:
  db_data:
    name: sqlite_data

networks:
  app_network:
    driver: bridge 